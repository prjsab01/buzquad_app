<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buzquad Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      .card { max-width: 28rem; padding: 2rem; border-radius: 1.5rem; background: white; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12); text-align: center; }
      h1 { margin: 0 0 1rem; font-size: 1.75rem; }
      p { margin: 0.5rem 0; color: #475569; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Buzquad Offline</h1>
      <p>You are offline. The app shell is cached and will load when connectivity returns.</p>
      <p>Try again when your network is available.</p>
    </div>
  </body>
</html>
